<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réécriture</title>
<style>
:root{--fond:#020603;--v:#33e06a;--v2:#1c7a3c;--v3:#0e3a1e;--clair:#c9ffd9;--r:#ff4b3a;--r2:#8a2a22}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--fond);color:var(--v);font:16px/1.45 "SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  text-shadow:0 0 6px #33e06a66;display:grid;grid-template-rows:auto 1fr;gap:14px;padding:14px 16px 16px;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(#0000 0 2px,#0004 2px 3px)}
header{display:flex;gap:2ch;align-items:start}
#niveaux{display:flex;gap:0 1ch;flex-wrap:wrap;flex:1}
#niveaux button{color:var(--v2)}
#niveaux button.fait{color:var(--clair)}
#niveaux button[aria-pressed=true]{color:var(--fond);background:var(--v);text-shadow:none;padding:0 1ch}
#survol{color:var(--clair);margin-left:2ch;white-space:nowrap}
#langues{display:flex;gap:8px;padding-top:3px}
#langues button{width:27px;height:18px;opacity:.35;border:1px solid var(--v3)}
#langues button:hover{opacity:.7}
#langues button[aria-pressed=true]{opacity:1;border-color:var(--v)}
#langues svg{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;text-shadow:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible{outline:1px solid var(--clair);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(30ch,27%) 14px minmax(0,1fr) 14px 36ch;min-height:0}
.poignee{cursor:col-resize;touch-action:none;position:relative}
.poignee::after{content:"";position:absolute;top:8px;bottom:0;left:6px;width:2px;background:var(--v2);opacity:0}
.poignee:hover::after,.poignee.tire::after{opacity:1}
.cadre{border:1px solid var(--v2);position:relative;padding:18px 12px 10px;min-height:0;min-width:0;display:flex;flex-direction:column}
.cadre>h2{position:absolute;top:-.75em;left:1ch;margin:0;padding:0 1ch;background:var(--fond);font:inherit;color:var(--v)}
.droite{display:grid;grid-template-rows:auto 1fr auto;gap:14px;min-height:0}
#essais{overflow:auto;display:grid;align-content:start;gap:0 2ch;scrollbar-color:var(--v3) var(--fond)}
#essais button{white-space:pre;color:var(--v2)}
#essais button.ok{color:var(--v)}
#essais button.ko{color:var(--r);text-shadow:0 0 6px #ff4b3a66}
#essais button[aria-pressed=true]{background:var(--v3);color:var(--clair)}
#essais button.ko[aria-pressed=true]{background:#3a0e0a;color:#ffc9c2}
#ecran{flex:1;min-height:0;position:relative;overflow:hidden}
#arbre{position:absolute;inset:0;width:100%;height:100%}
#trace{position:absolute;inset:0;background:var(--fond);overflow:auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:0 1ch 8px;font-size:18px}
#trace[hidden]{display:none}
#trace>*{white-space:pre;flex:none}
.t_cmd{display:flex;gap:3ch;padding:2px 0 8px;position:sticky;top:0;background:var(--fond);align-self:stretch}
.t_cmd button{padding:0 1ch}
.t_cmd button:disabled{color:var(--v3);cursor:default}
.t_regle{color:var(--v2);padding-left:3ch;font-size:15px}
.t_redex{background:var(--v3);color:var(--clair);text-shadow:none;border-bottom:2px solid currentColor}
.t_bon{color:var(--v)}.t_juste{color:var(--clair)}.t_ko{color:var(--r);text-shadow:0 0 6px #ff4b3a66}

#imposes{white-space:pre;color:var(--v2);padding-left:1ch}
.saisie{display:grid;grid-template-columns:3ch 1fr;flex:1;min-height:0}
#marge{white-space:pre;color:var(--v2);overflow:hidden;text-align:right;padding-right:1ch}
#marge .ko,#bilan .ko{color:var(--r)}
textarea{font:inherit;color:var(--clair);text-shadow:inherit;background:none;border:0;outline:0;resize:none;padding:0;caret-color:var(--clair);text-transform:uppercase;white-space:pre;overflow:auto}
textarea::placeholder{color:var(--v3)}
#compte.ok{color:var(--clair)}
#ref{color:var(--v2)}
#valider{align-self:start;margin-top:8px;padding:2px 2ch;color:var(--fond);background:var(--v);text-shadow:none}
#valider[hidden]{display:none}
#valider:hover{background:var(--clair)}
#aide{color:var(--v2);margin-top:6px;white-space:pre-line}
#fete{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#fete[hidden]{display:none}
#ouvrir{color:var(--v);white-space:nowrap}
#carte{position:fixed;inset:0;z-index:2;background:var(--fond);padding:28px 5vw 40px;overflow:auto}
#carte[hidden]{display:none}
#c_tete{display:grid;grid-template-columns:1fr auto;gap:6px 4ch;align-items:start;margin-bottom:30px}
#c_tete h1{margin:0;font:inherit;font-size:34px;letter-spacing:.35em;color:var(--clair)}
#c_tete p{grid-column:1;max-width:76ch}
#c_langues{grid-column:2;grid-row:1/3;display:flex;gap:10px}
#c_langues button{width:39px;height:26px;opacity:.35;border:1px solid var(--v3)}
#c_langues button:hover{opacity:.7}
#c_langues button[aria-pressed=true]{opacity:1;border-color:var(--v)}
#c_langues svg{display:block;width:100%;height:100%}
#c_grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(34ch,1fr));gap:26px 3ch;align-items:start}
#c_grille section{border:3px double var(--v2);position:relative;padding:16px 2ch 10px;display:grid;align-content:start}
#c_grille h2{position:absolute;top:-.8em;left:2ch;margin:0;padding:0 1ch;background:var(--fond);font:inherit;color:var(--v);white-space:nowrap}
#c_grille h2 span{color:var(--v2)}
#carte button{color:var(--v2);white-space:nowrap}
#carte button.fait{color:var(--clair)}
#carte button.notion{color:var(--v);text-align:center;margin:.35em 0 .1em;display:flex;align-items:center;gap:1ch}
#carte button.notion::before,#carte button.notion::after{content:"";flex:1;border-top:1px solid var(--v3)}
#carte button.notion:hover{color:var(--clair)}
#notions{display:flex;flex-wrap:wrap;gap:0 2ch;margin-top:4px}
#notions button{color:var(--v2)}
#notions button:hover{color:var(--clair)}
#voile{position:fixed;inset:0;z-index:2;background:#020603e6;display:grid;place-items:center}
#voile[hidden]{display:none}
#panneau{width:min(64ch,90vw);padding:26px 3ch 16px;gap:14px}
#panneau pre{margin:0;font:inherit;font-size:20px;color:var(--clair);white-space:pre-wrap}
#panneau .ko{color:var(--r);text-shadow:0 0 6px #ff4b3a66}
#panneau button{align-self:end;color:var(--clair)}
#carte button:hover,#carte button[aria-current=true]{background:var(--v3);color:var(--clair)}
p{margin:0}
#touches{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:10px}
#touches[hidden]{display:none}
#touches button{height:42px;border:1px solid var(--v2);color:var(--clair);text-align:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#touches button:active{background:var(--v3)}
@media (max-width:820px){
  html,body{height:auto;min-height:100%}
  body{display:block;overflow:auto;padding:10px 10px 24px}
  header{justify-content:space-between;margin-bottom:18px}
  #niveaux{display:none}
  main{display:flex;flex-direction:column;gap:20px}
  .droite{display:contents}
  .droite>section:nth-child(1){order:1}
  main>section:nth-of-type(2){order:2}
  .poignee{display:none}
  .droite>section:nth-child(2){order:3}
  .droite>section:nth-child(3){order:4}
  main>section:nth-of-type(1){order:5}
  #ecran{flex:none;height:min(38vh,320px)}
  textarea{min-height:7.5em}
  #essais{max-height:45vh}
  #carte{padding:18px 12px 30px}
  #c_tete{grid-template-columns:1fr;margin-bottom:24px}
  #c_tete h1{font-size:22px;letter-spacing:.2em}
  #c_langues{grid-column:1;grid-row:auto}
  #c_grille{grid-template-columns:1fr}
  #carte button{padding:4px 0}
  #panneau{padding:22px 2ch 14px}
  #panneau pre{font-size:15px;overflow-x:auto;white-space:pre}
}
</style>
</head>
<body>
<header><button id="ouvrir" aria-haspopup="true"></button><nav id="niveaux"></nav><div id="langues"></div></header>
<main>
  <section class="cadre"><h2><span id="t_essais"></span> <span id="compte"></span></h2><div id="essais"></div></section>
  <div class="poignee" data-c="g"></div>
  <section class="cadre"><h2 id="titre"></h2><div id="ecran"><canvas id="arbre"></canvas><div id="trace" hidden></div></div></section>
  <div class="poignee" data-c="d"></div>
  <div class="droite">
    <section class="cadre"><h2 id="nom"></h2><p id="consigne"></p><div id="notions"></div></section>
    <section class="cadre"><h2 id="t_regles"></h2><div id="imposes"></div><div class="saisie"><div id="marge" aria-hidden="true"></div>
      <textarea id="texte" spellcheck="false" autocapitalize="characters" placeholder="AA > B"></textarea></div><div id="touches" hidden></div><p id="aide"></p></section>
    <section class="cadre"><h2 id="t_bilan"></h2><p id="bilan"></p><p id="ref"></p><button id="valider" hidden></button></section>
  </div>
</main>
<div id="carte" hidden><div id="c_tete"><h1>RÉÉCRITURE</h1><div id="c_langues"></div><p id="c_intro"></p></div><div id="c_grille"></div></div>
<div id="voile" hidden><section class="cadre" id="panneau"><pre id="p_ex"></pre><button id="p_ok">↵</button></section></div>
<canvas id="fete" hidden aria-hidden="true"></canvas>
<script>
'use strict';
/* Moteur : réécriture de mots, tous les ordres. Partagé par la page et par les outils (node). */
function sites(w,r,f){
  if(r.debut){if(w.startsWith(r.l)&&(!r.fin||r.l.length===w.length))f(0);return}
  if(r.fin){const p=w.length-r.l.length;if(p>=0&&w.endsWith(r.l))f(p);return}
  for(let p=w.indexOf(r.l);p>=0;p=w.indexOf(r.l,p+1))f(p);
}
const systemeMots=regles=>({taille:w=>w.length,succ(w,f){regles.forEach((r,ri)=>sites(w,r,p=>f(w.slice(0,p)+r.r+w.slice(p+r.l.length),ri,p)))}});
/* Termes : A, C(A,B), E(A).
   Dans une règle, x y z valent un sous-terme entier et 1 2 une feuille quelconque du domaine. */
function lireTerme(src,sig,regle){let i=0;
  const t=()=>{const c=src[i++];if(c===undefined)throw 0;
    if(regle&&'xyz'.includes(c))return{v:c};
    if(regle&&(c==='1'||c==='2'))return{j:c};
    const a=sig[c];if(a===undefined)throw 0;
    if(a===0)return{s:c,k:[]};
    if(src[i]==='('){i++;const k=[t()];while(src[i]===','){i++;k.push(t())}if(src[i++]!==')'||k.length!==a)throw 0;return{s:c,k}}
    throw 0};
  const x=t();if(i!==src.length)throw 0;return x}
const cle=t=>t.v||t.j||(t.k.length?t.s+'('+t.k.map(cle).join(',')+')':t.s);
const filtre=(m,t,env)=>m.v?(env[m.v]=t,true):m.s===t.s&&m.k.every((c,i)=>filtre(c,t.k[i],env));
const subst=(r,env)=>r.v?env[r.v]:{s:r.s,k:r.k.map(c=>subst(c,env))};
function systemeTermes(regles,sig){const vus=new Map(),lu=w=>{let t=vus.get(w);if(!t){t=lireTerme(w,sig);vus.set(w,t)}return t};
  return{taille:w=>w.replace(/[(),]/g,'').length,
    succ(w,f){let pos=0;
      const rec=(n,refaire)=>{const p=pos++;regles.forEach((r,ri)=>{const env={};if(filtre(r.m,n,env))f(cle(refaire(subst(r.r,env))),ri,p)});
        n.k.forEach((c,i)=>rec(c,x=>refaire({s:n.s,k:n.k.map((d,j)=>j===i?x:d)})))};
      rec(lu(w),x=>x)}}}
const systeme=(niv,regles)=>niv.sig?systemeTermes(regles,niv.sig):systemeMots(regles);
/* Graphe complet des mots atteignables, avec le statut de chaque mot. */
function explorer(depart,sys,attendu,plafond,lmax){
  const N=[],rang=new Map();
  const noeud=(w,d)=>{let i=rang.get(w);if(i===undefined){if(N.length>=plafond||sys.taille(w)>lmax)return -1;i=N.length;rang.set(w,i);N.push({w,d,succ:[],coupe:false,boucle:false})}return i};
  noeud(depart,0);
  for(let q=0;q<N.length;q++){const n=N[q];
    sys.succ(n.w,(v,ri,p)=>{const j=noeud(v,n.d+1);if(j<0)n.coupe=true;else n.succ.push({to:j,ri,p})})}
  const etat=new Uint8Array(N.length),ordre=[];let cyclique=false;const pile=[[0,0]];etat[0]=1;
  while(pile.length){const top=pile[pile.length-1],n=N[top[0]];
    if(top[1]<n.succ.length){const j=n.succ[top[1]++].to;
      if(etat[j]===1){n.boucle=true;cyclique=true}else if(etat[j]===0){etat[j]=1;pile.push([j,0])}}
    else{etat[top[0]]=2;ordre.push(top[0]);pile.pop()}}
  for(const n of N){n.fin=!n.succ.length&&!n.coupe;n.juste=n.fin&&n.w===attendu;n.bon=n.juste;n.mauvais=(n.fin&&!n.juste)||n.coupe||n.boucle}
  for(let ch=true;ch;){ch=false;for(const n of N)for(const e of n.succ){const m=N[e.to];
    if(m.bon&&!n.bon){n.bon=true;ch=true}if(m.mauvais&&!n.mauvais){n.mauvais=true;ch=true}}}
  if(!cyclique){for(const n of N)n.d=0;for(let k=ordre.length-1;k>=0;k--){const n=N[ordre[k]];for(const e of n.succ)N[e.to].d=Math.max(N[e.to].d,n.d+1)}}
  return{N,ok:!N[0].mauvais,cyclique};
}
/* Verdict seul : s'arrête à la première issue fausse. */
function verdict(depart,sys,attendu,plafond,lmax){
  const W=[depart],S=[],rang=new Map([[depart,0]]);
  for(let q=0;q<W.length;q++){const w=W[q],s=[];let coupe=false;
    sys.succ(w,v=>{let j=rang.get(v);
      if(j===undefined){if(W.length>=plafond||sys.taille(v)>lmax){coupe=true;return}j=W.length;rang.set(v,j);W.push(v)}s.push(j)});
    if(coupe||(!s.length&&w!==attendu))return false;S.push(s)}
  const etat=new Uint8Array(W.length),pile=[[0,0]];etat[0]=1;
  while(pile.length){const top=pile[pile.length-1],s=S[top[0]];
    if(top[1]<s.length){const j=s[top[1]++];if(etat[j]===1)return false;if(etat[j]===0){etat[j]=1;pile.push([j,0])}}
    else{etat[top[0]]=2;pile.pop()}}
  return true;
}
/* Règles en texte : une par ligne, « motif > remplacement » (>, ->, =>, → ou = ; # commentaire).
   ^ et $ accrochent au début et à la fin du mot ; 1 et 2 valent une lettre quelconque du domaine. */
const COTE=6,COTE_T=7;
function lireTermes(texte,niv){const regles=[],fautes=[];let lignes=0,symboles=0;
  texte.split('\n').forEach((brut,i)=>{const l=brut.replace(/#.*/,'').replace(/\s+/g,'').replace(/[a-e]/g,c=>c.toUpperCase()).replace(/[XYZ]/g,c=>c.toLowerCase());if(!l)return;
    try{const m=l.match(/^(.+?)(?:->|=>|→|>|=)(.+)$/);if(!m)throw 0;
      const g=lireTerme(m[1],niv.sig,true),d=lireTerme(m[2],niv.sig,true),vg=[],jg=new Set();let ng=0,nd=0;
      if(g.v||g.j)throw 0;
      (function p(t){ng++;if(t.v){if(vg.includes(t.v))throw 0;vg.push(t.v)}else if(t.j){if(!niv.jokers)throw 0;jg.add(t.j)}else t.k.forEach(p)})(g);
      (function p(t){nd++;if(t.v){if(!vg.includes(t.v))throw 0}else if(t.j){if(!jg.has(t.j))throw 0}else t.k.forEach(p)})(d);
      if(ng>COTE_T||nd>COTE_T)throw 0;
      lignes++;symboles+=ng+nd;let cas=[{}];for(const k of jg)cas=cas.flatMap(a=>[...niv.jokers].map(x=>({...a,[k]:x})));
      for(const a of cas){const tr=t=>t.j?{s:a[t.j],k:[]}:t.v?t:{s:t.s,k:t.k.map(tr)};regles.push({m:tr(g),r:tr(d),ligne:i})}
    }catch(e){fautes.push(i)}});
  return{regles,fautes,lignes,symboles}}
function lire(texte,niv){if(niv.sig)return lireTermes(texte,niv);const regles=[],fautes=[];let lignes=0,symboles=0;
  texte.split('\n').forEach((brut,i)=>{const l=brut.replace(/#.*/,'').trim().toUpperCase();if(!l)return;
    const m=l.match(/^(\^?)([A-E12]+)(\$?)\s*(?:->|=>|→|>|=)\s*([A-E12]*)$/);let ok=!!m;
    if(ok){const g=m[2],d=m[4];
      if((m[1]||m[3])&&!niv.ancrages)ok=false;
      if(g.length>COTE||d.length>COTE)ok=false;
      for(const c of g+d)if(c==='1'||c==='2'){if(!niv.jokers||!g.includes(c))ok=false}else if(!niv.alphabet.includes(c))ok=false;
      if(ok){lignes++;symboles+=g.length+d.length;
        let cas=[{}];for(const k of new Set(g.match(/[12]/g)||[]))cas=cas.flatMap(a=>[...niv.jokers].map(x=>({...a,[k]:x})));
        for(const a of cas){const tr=s=>s.replace(/[12]/g,c=>a[c]);regles.push({l:tr(g),r:tr(d),debut:!!m[1],fin:!!m[3],ligne:i})}}}
    if(!ok)fautes.push(i)});

  for(const c of k){const b=document.createElement('button');b.textContent=c;b.onpointerdown=e=>{e.preventDefault();frapper(c)};z.append(b)}}
function frapper(c){const a=texte.selectionStart,b=texte.selectionEnd,v=texte.value;texte.focus();
  if(c==='⌫'){const d=a===b?Math.max(0,a-1):a;texte.value=v.slice(0,d)+v.slice(b);texte.setSelectionRange(d,d)}
  else{const t=c==='↵'?'\n':c==='>'?' > ':c;texte.value=v.slice(0,a)+t+v.slice(b);texte.setSelectionRange(a+t.length,a+t.length)}
  texte.dispatchEvent(new Event('input'))}
texte.addEventListener('input',()=>{if(niveau().sig){const a=texte.selectionStart,b=texte.selectionEnd,v=texte.value.replace(/[a-e]/g,c=>c.toUpperCase()).replace(/[XYZ]/g,c=>c.toLowerCase());if(v!==texte.value){texte.value=v;texte.setSelectionRange(a,b)}}
  jeu().texte=texte.value;garde[niveau().id]=texte.value;ecrit(CLE,JSON.stringify(garde));clearTimeout(attente);finir(false);attente=setTimeout(()=>{choix=null;tout(true,true)},180)});
texte.addEventListener('scroll',()=>{$('marge').scrollTop=texte.scrollTop});
{const z=$('niveaux'),s=document.createElement('span');s.id='survol';
  NIVEAUX.forEach((n,i)=>{const b=document.createElement('button');b.textContent=num(i);if(i&&n.ch!==NIVEAUX[i-1].ch)b.style.marginLeft='2ch';
    b.onclick=()=>aller(i);b.onpointerenter=b.onfocus=()=>{s.textContent=num(i)+' '+nomDe(n)};b.onpointerleave=b.onblur=()=>{s.textContent=''};z.append(b)});

    b.innerHTML=`<svg viewBox="0 0 60 40" preserveAspectRatio="none" aria-hidden="true">${DRAPEAUX[l]||''}</svg>`;
    b.onclick=()=>{langue=l;ecrit('reecriture-langue',l);const ouverte=!$('carte').hidden;tout(false);if(ouverte)carte(true);else texte.focus()};$(zone).append(b)}}
/* dans la vue en mots : glisser sur un morceau de mot pour en faire un motif ; dans la vue en points : survol */
function vise(e){const b=cv.getBoundingClientRect(),x=(e.clientX-b.left-plan.ox)/cw,y=e.clientY-b.top-plan.oy;
  for(const n of plan.g.N)if(n.w&&y>=n.d*plan.ph-corps*.3&&y<=n.d*plan.ph+corps*1.4&&x>=n.x-.3&&x<=n.x+n.lw+.3)return{n,k:Math.max(0,Math.min(n.w.length-1,Math.floor(x-n.x)))};return null}
cv.onpointermove=e=>{if(!plan)return;
  if(plan.mode==='points'){const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;let m=null,dm=144;
    for(const n of plan.g.N){const d=(n.px-x)**2+(n.py-y)**2;if(d<dm){dm=d;m=n}}
    survoler(m);return}
  const v=vise(e);survoler(v?v.n:null)};
cv.onpointerleave=()=>{if(plan)survoler(null)};
cv.onclick=e=>{if(!plan)return;if(plan.mode==='points'){const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;let m=null,dm=400;for(const n of plan.g.N){const d=(n.px-x)**2+(n.py-y)**2;if(d<dm){dm=d;m=n}}if(m)branche(m)}else{const v=vise(e);if(v)branche(v.n)}};
addEventListener('resize',()=>{mesurer();disposer();peindre()});
new ResizeObserver(()=>{const b=$('ecran');if(b.clientWidth!==L||b.clientHeight!==H){mesurer();disposer();peindre()}}).observe($('ecran'));
